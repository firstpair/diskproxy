[package]
name = "diskproxy-core"
version = "0.2.0"
edition = "2024"
description = "Policy-independent read-only source, exFAT, HTTP and WebDAV engine"

[dependencies]
anyhow = "1"
chrono = "0.4"
getrandom = "0.3"
percent-encoding = "2"
roxmltree = "0.20"
rustix = { version = "1", features = ["fs"] }
serde_json = "1"
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"
