[package]
name = "diskproxy-core"
version = "0.2.0"
edition = "2024"
description = "Policy-independent read-only source, exFAT, HTTP and WebDAV engine"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
getrandom = "0.3"
nfsserve = "0.11"
notify = "8"
percent-encoding = "2"
roxmltree = "0.20"
rustix = { version = "1", features = ["fs", "process"] }
serde_json = "1"
tiny_http = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
unicode-normalization = "0.1.26"

[dev-dependencies]
tempfile = "3"
