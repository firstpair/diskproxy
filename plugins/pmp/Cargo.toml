[package]
name = "diskproxy-pmp"
version = "0.2.0"
edition = "2024"
description = "Photo Mechanic Plus ingest timestamp, history and portable-card policy"

[dependencies]
anyhow = "1"
chrono = "0.4"
chrono-tz = "0.10"
getrandom = "0.3"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
diskproxy-core = { path = "../../crates/core" }
