[workspace]
members = ["crates/core", "plugins/pmp", "examples/hide-plugin"]
resolver = "2"

[package]
name = "diskproxy"
version = "0.2.0"
edition = "2024"
description = "Read-only virtual disks and WebDAV with application-specific plugins"

[[bin]]
name = "diskproxy-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
diskproxy-core = { path = "crates/core" }
diskproxy-pmp = { path = "plugins/pmp" }

[dev-dependencies]
tempfile = "3"
roxmltree = "0.20"

[profile.release]
strip = true
lto = "thin"
